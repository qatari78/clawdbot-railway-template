name: Full history secret scan
# rerun against main 79bc17fff130bc47b77f2dd6a2184ee2adac370e

on:
  push:
    branches:
      - audit/full-history-gitleaks-2026-09-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-main-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scan branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact main ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          echo "MAIN_COMMITS=$(git rev-list --count origin/main)" >> "$GITHUB_ENV"
          echo "main_commits=$(git rev-list --count origin/main)"

      - name: Scan full main history with redaction
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/gitleaks-redacted.json"
          RAWLOG="$RUNNER_TEMP/gitleaks-raw.log"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$RUNNER_TEMP:/scanout" \
            zricethezav/gitleaks:v8.28.0 \
            detect \
            --source=/repo \
            --log-opts="origin/main" \
            --report-format=json \
            --report-path=/scanout/gitleaks-redacted.json \
            --redact=100 \
            --exit-code=0 \
            >"$RAWLOG" 2>&1

          if [[ ! -f "$REPORT" ]]; then
            echo "gitleaks_report_missing=1"
            exit 2
          fi

          COUNT="$(jq 'length' "$REPORT")"
          echo "scanned_main_commits=$MAIN_COMMITS"
          echo "findings=$COUNT"

          if [[ "$COUNT" -gt 0 ]]; then
            jq -r '.[] | "finding commit=" + (.Commit // "unknown") + " file=" + (.File // "unknown") + " rule=" + (.RuleID // "unknown")' "$REPORT"
            rm -f "$REPORT" "$RAWLOG"
            exit 1
          fi

          rm -f "$REPORT" "$RAWLOG"
          echo "result=PASS"
